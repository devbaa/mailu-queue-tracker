# Rspamd metadata exporter for Mailu Tools.
#
# Install as a Mailu Rspamd override, for example:
#
#     /opt/mailu/overrides/rspamd/mailut-exporter.conf
#
# and restart the antispam container:
#
#     cd /opt/mailu && docker compose restart antispam
#
# Mailu Tools does NOT write this file for you: `make install` never modifies
# Mailu or Rspamd configuration. Copy it deliberately, then verify with
#
#     mailut audit doctor
#
# The collector listens on the host's loopback address. From inside the
# antispam container the host is reachable as host.docker.internal on Docker
# Desktop, or via the gateway of a Docker *bridge* network this container is
# attached to on Linux (commonly 172.17.0.1). Set the URL to match your setup;
# whatever you choose must resolve to the address in `collector.bind` and must
# not be exposed off the host. Find the right address with:
#
#     mailut audit doctor
#
# AUTHENTICATION. Set `collector.token_file` in /etc/mailut/mailut.conf and put
# the same token in `password` below, so that only Rspamd can submit audit
# evidence. Rspamd's metadata_exporter cannot send an arbitrary header, but its
# http backend does send HTTP Basic credentials built from `user`/`password`,
# and Mailu Tools accepts the token as the password. The username is not a
# secret. Generate a token with:
#
#     umask 077 && openssl rand -hex 32 > /etc/mailut/collector.token
#
# This file then contains a secret: keep it mode 0600.

metadata_exporter {
  rules {
    mailut {
      backend = "http";
      url = "http://172.17.0.1:8765/rspamd";
      # Must match collector.token_file on the host. Without it the collector
      # rejects every export with 401 (and if the host has no token_file set,
      # anything able to reach the port could forge audit evidence).
      user = "mailut";
      password = "REPLACE-WITH-THE-CONTENTS-OF-collector.token";
      # Export every scanned message, not only rejections: Mailu Tools needs
      # accepted mail too, so that "we never saw it" can be told apart from
      # "we accepted it".
      selector = <<EOD
return function(task)
  return true
end
EOD;
      formatter = <<EOD
return function(task)
  local ucl = require "ucl"
  local rspamd_util = require "rspamd_util"

  local out = {}
  out['timestamp'] = math.floor(rspamd_util.get_time())

  local from = task:get_from('smtp')
  if from and from[1] then out['from'] = from[1]['addr'] end

  local rcpts = {}
  local to = task:get_recipients('smtp')
  if to then
    for _, r in ipairs(to) do
      if r['addr'] then table.insert(rcpts, r['addr']) end
    end
  end
  out['rcpt'] = rcpts

  local hfrom = task:get_from('mime')
  if hfrom and hfrom[1] then out['header_from'] = hfrom[1]['addr'] end

  out['subject']    = task:get_subject()
  out['message_id'] = task:get_message_id()
  out['qid']        = task:get_queue_id()
  out['session_id'] = task:get_uid()
  out['helo']       = task:get_helo()
  out['user']       = task:get_user()
  out['size']       = task:get_size()

  local ip = task:get_from_ip()
  if ip and ip:is_valid() then out['ip'] = tostring(ip) end

  local metric = task:get_metric_result()
  if metric then
    out['score']          = metric['score']
    out['required_score'] = metric['required_score']
    out['action']         = metric['action']
  else
    out['action'] = task:get_metric_action()
  end

  local symbols = {}
  local sym = task:get_symbols_all()
  if sym then
    for _, s in ipairs(sym) do
      local entry = { symbol = s['name'], score = s['score'] }
      if s['options'] then entry['options'] = table.concat(s['options'], ',') end
      table.insert(symbols, entry)
    end
  end
  out['symbols'] = symbols

  -- Optional: export the RFC822 header section so that scopes collecting at
  -- level "headers" have something to store. Uncomment to enable; Mailu Tools
  -- stores it only for scopes whose level permits it.
  --
  -- local headers = task:get_header_section()
  -- if headers then out['headers'] = tostring(headers) end
  --
  -- Optional: export the complete message, base64 encoded, for scopes at
  -- level "message". This is large and sensitive; audit.allow_messages must
  -- also be true on the host. Leave disabled unless you really need it.
  --
  -- local content = task:get_content()
  -- if content then out['message_b64'] = rspamd_util.encode_base64(content) end

  return ucl.to_format(out, 'json-compact')
end
EOD;
    }
  }
}
