name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest (26.04) has no Python 3.9 build for setup-python,
    # and 3.9 is the oldest version mailut supports.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Static checks
        run: make check PYTHON=python3
      - name: Test suite
        run: make test PYTHON=python3
      - name: Staged install
        run: |
          make install DESTDIR="${RUNNER_TEMP}/mailut-root" PYTHON=python3
          find "${RUNNER_TEMP}/mailut-root" -type f | sort
